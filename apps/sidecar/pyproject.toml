[project]
name = "nmos-sidecar"
version = "0.1.0b7"
description = "NMOS sidecar and worker: source ledger, reconciliation, state, extraction, hybrid recall"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[project.scripts]
nmos-migrate = "nmos_sidecar.migrate:main"
nmos-rebuild = "nmos_sidecar.rebuild:main"
nmos-worker = "nmos_sidecar.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nmos_sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
