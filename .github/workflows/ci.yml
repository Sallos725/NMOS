name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # release.yml runs the same checks before publishing

jobs:
  sidecar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nmos
          POSTGRES_PASSWORD: nmos
          POSTGRES_DB: nmos
        ports: ["5436:5432"]
        options: >-
          --health-cmd "pg_isready -U nmos" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/pocketrisu-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: dist is up to date
        run: git diff --exit-code -- dist/

  # Every main merge that passes publishes :edge for the owner to try (AGENTS.md §13). No tag, no GitHub
  # release. Skipped on pull requests and when release.yml calls this workflow for a tag.
  edge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [sidecar, plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sidecar.Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/sallos725/nmos-sidecar:edge
            ghcr.io/sallos725/nmos-sidecar:edge-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Sallos725/NMOS
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
