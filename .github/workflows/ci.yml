name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # release.yml runs the same checks before publishing

jobs:
  sidecar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nmos
          POSTGRES_PASSWORD: nmos
          POSTGRES_DB: nmos
        ports: ["5436:5432"]
        options: >-
          --health-cmd "pg_isready -U nmos" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/pocketrisu-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: dist is up to date
        run: git diff --exit-code -- dist/
