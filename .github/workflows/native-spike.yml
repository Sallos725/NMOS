name: native-spike

# Spike: build the Docker-free bundle on each PocketRisu target and smoke-test it under a Korean path.
on:
  workflow_dispatch:
  push:
    branches: [spike/native-bundle]
    paths: ["tools/native/**", ".github/workflows/native-spike.yml"]

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-22.04 }
          - { target: linux-arm64, os: ubuntu-22.04-arm }
          - { target: macos-arm64, os: macos-14 }
          - { target: win-x64, os: windows-2022 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: bash
        run: uv run --no-project --python 3.12 python tools/native/build_bundle.py --target ${{ matrix.target }} --version 0.0.0-spike
      - name: Linked libraries (diagnostic)
        if: runner.os == 'macOS'
        run: |
          otool -L dist-native/NMOS-v0.0.0-spike-macos-arm64/pgsql/bin/postgres
          otool -L dist-native/NMOS-v0.0.0-spike-macos-arm64/pgsql/lib/vector.dylib || ls dist-native/NMOS-v0.0.0-spike-macos-arm64/pgsql/lib | head -50
      - name: Smoke (first start, pgvector + Korean pg_trgm, clean stop, second start)
        continue-on-error: ${{ runner.os == 'Windows' }}  # spike: records whether a Korean path works on a cp1252 runner
        shell: bash
        run: |
          archive=$(ls dist-native/NMOS-v0.0.0-spike-${{ matrix.target }}.*)
          uv run --no-project --python 3.12 python tools/native/ci_smoke.py "$archive" "${{ runner.temp }}"
      - name: Locale probe (diagnostic)
        if: always() && runner.os != 'Linux'
        shell: bash
        run: |
          archive=$(ls dist-native/NMOS-v0.0.0-spike-${{ matrix.target }}.*)
          mkdir -p probe && tar -xf "$archive" -C probe 2>/dev/null || unzip -q "$archive" -d probe
          b=$(ls -d probe/NMOS-*)
          py=$b/python/bin/python3; [ -f "$py" ] || py=$b/python/python.exe
          if [ "$RUNNER_OS" = Windows ]; then locs="en-US ko-KR Korean_Korea.949 C"; else locs="en_US.UTF-8 ko_KR.UTF-8 UTF-8 C.UTF-8 C"; fi
          "$py" tools/native/locale_probe.py "$b" $locs
      - name: libc character classes (diagnostic, macOS)
        if: always() && runner.os == 'macOS'
        run: cc -o wctype_probe tools/native/macos/wctype_probe.c && ./wctype_probe
      - name: Sidecar test suite against the bundle's PostgreSQL (macOS)
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          b=$(ls -d probe/NMOS-*)
          NMOS_SIDECAR_PORT=8795 "$b/python/bin/python3" "$b/nmos_launcher.py" > launcher.log 2>&1 &
          until curl -sf http://127.0.0.1:8795/v1/health > /dev/null; do sleep 1; done
          cd apps/sidecar
          NMOS_TEST_ADMIN_URL="postgresql://nmos:$(cat "$OLDPWD/$b/data/db-password")@127.0.0.1:54390/postgres" uv run pytest -q
      - name: Smoke under a Korean folder on C:, where 8.3 short names exist (Windows)
        if: always() && runner.os == 'Windows'
        shell: bash
        run: |
          fsutil 8dot3name query C: || true
          fsutil 8dot3name query D: || true
          archive=$(ls dist-native/NMOS-v0.0.0-spike-${{ matrix.target }}.*)
          uv run --no-project --python 3.12 python tools/native/ci_smoke.py "$archive" "C:\Users\runneradmin" "사용자 폴더"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NMOS-${{ matrix.target }}
          path: dist-native/NMOS-v0.0.0-spike-${{ matrix.target }}.*
          retention-days: 7
