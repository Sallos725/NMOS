name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"                       # e.g. 0.1.0-beta.2
          py=$(grep -m1 '^version' apps/sidecar/pyproject.toml | cut -d'"' -f2)   # e.g. 0.1.0b2
          js=$(node -p "require('./adapters/pocketrisu-plugin/package.json').version")
          pep=$(echo "$tag" | sed -E 's/-beta\.([0-9]+)$/b\1/; s/-rc\.([0-9]+)$/rc\1/')
          echo "tag=$tag plugin=$js sidecar=$py"
          [ "$js" = "$tag" ] && [ "$py" = "$pep" ] || { echo "version mismatch"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build plugin
        working-directory: adapters/pocketrisu-plugin
        run: npm ci && npm run build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then echo "channel=beta" >> "$GITHUB_OUTPUT"; else echo "channel=latest" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sidecar.Dockerfile
          push: true
          tags: |
            ghcr.io/sallos725/nmos-sidecar:${{ steps.meta.outputs.version }}
            ghcr.io/sallos725/nmos-sidecar:${{ steps.meta.outputs.channel }}
          labels: |
            org.opencontainers.image.source=https://github.com/Sallos725/NMOS
            org.opencontainers.image.licenses=MIT
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp adapters/pocketrisu-plugin/dist/nmos-pocketrisu.js nmos-pocketrisu.js
          cp deploy/docker-compose.yml nmos-docker-compose.yml
          flags=""; [[ "$GITHUB_REF_NAME" == *-* ]] && flags="--prerelease"
          notes=$(awk -v v="## ${GITHUB_REF_NAME#v}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" nmos-pocketrisu.js nmos-docker-compose.yml \
            --title "NMOS $GITHUB_REF_NAME" --notes "$notes" $flags
