name: native

# Phase 23: the Docker-free bundle on each PocketRisu portable target, built from pinned sources
# (tools/native/sources.json) and checked from a folder with a Korean name and a space.
on:
  workflow_dispatch:
  pull_request:
    paths: ["tools/native/**", ".github/workflows/native.yml"]

permissions:
  contents: read
  pull-requests: read  # the Windows suite's file check

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-22.04, suite: true }
          - { target: linux-arm64, os: ubuntu-22.04-arm, suite: false }
          - { target: macos-arm64, os: macos-14, suite: true }
          # C:\ has 8.3 short names (the launcher's way around PostgreSQL's ANSI paths), and a folder made at its
          # root inherits access for every signed-in user, which the launcher must take away from data/.
          - { target: win-x64, os: windows-2022, suite: true, parent: "C:/NMOS-CI" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no major tags since v8
      - name: Build (Linux, in the pinned build image; the vendored libraries' packages are checked)
        if: runner.os == 'Linux'
        run: uv run --no-project --python 3.12 python tools/native/build_linux.py --target ${{ matrix.target }} --version 0.0.0-ci
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: uv run --no-project --python 3.12 python tools/native/build_bundle.py --target ${{ matrix.target }} --version 0.0.0-ci
      - name: Build (MSVC x64 environment for pgvector)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          uv run --no-project --python 3.12 python tools/native/build_bundle.py --target ${{ matrix.target }} --version 0.0.0-ci
      - name: Smoke (start, Korean pg_trgm, stop, restart, the three refusals)
        shell: bash
        run: uv run --no-project --python 3.12 python tools/native/ci_smoke.py smoke dist-native/NMOS-v0.0.0-ci-${{ matrix.target }}.* "${{ matrix.parent || runner.temp }}"
      - name: NMOS.app from the .dmg, its menu-bar item and login item (macOS)
        if: runner.os == 'macOS'
        run: uv run --no-project --python 3.12 python tools/native/ci_smoke.py app dist-native/NMOS-v0.0.0-ci-macos-arm64.dmg "${{ runner.temp }}" "앱 테스트"
      - name: A drive without short names gets the move message (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          fsutil 8dot3name query D: || true
          uv run --no-project --python 3.12 python tools/native/ci_smoke.py refuse dist-native/NMOS-v0.0.0-ci-win-x64.zip "${{ runner.temp }}" "한글 폴더" "non-English characters"
      - name: NMOS.exe, the tray and start at login (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: uv run --no-project --python 3.12 python tools/native/ci_smoke.py tray dist-native/NMOS-v0.0.0-ci-win-x64.zip "${{ matrix.parent }}" "트레이 테스트"
      # Windows' suite takes ~15 minutes (Linux and macOS ~4): on a pull request it runs only when what the sidecar
      # runs on in the bundle changed (the launcher, the build, the pins, the smokes); always on a manual run. A
      # sidecar-only change does not start this workflow: its suite runs in ci.yml, and the release runs this one.
      - name: Does the Windows suite need to run?
        id: winsuite
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(gh pr diff ${{ github.event.pull_request.number }} -R ${{ github.repository }} --name-only)
          echo "$changed"
          if echo "$changed" | grep -qE '^tools/native/(launcher/|build_bundle\.py|sources\.json|smoke\.py|ci_smoke\.py)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Sidecar test suite against the bundle's PostgreSQL
        if: matrix.suite && (runner.os != 'Windows' || steps.winsuite.outputs.run == 'true')
        shell: bash
        run: uv run --no-project --python 3.12 python tools/native/ci_smoke.py suite dist-native/NMOS-v0.0.0-ci-${{ matrix.target }}.* "${{ matrix.parent || runner.temp }}" "테스트 폴더"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: NMOS-${{ matrix.target }}
          path: dist-native/NMOS-v0.0.0-ci-${{ matrix.target }}.*
          retention-days: 7
