name: Idea or request / 제안
description: Something NMOS should remember, show or do. / NMOS가 기억하거나 보여 주거나 했으면 하는 것.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is missing? / 무엇이 아쉬운가요?
      description: The situation in your chat where NMOS falls short today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help? / 어떻게 되면 좋을까요?
